- alias: Echo
  description: 'This automation echoes back all messages received via the serial_receiver_ttyacm0'
  triggers:
    - trigger: state
      entity_id:
        - sensor.serial_receiver_ttyacm0
  conditions: []
  actions:
    - action: notify.send_message
      metadata: {}
      target:
        entity_id: notify.serial_transmitter_ttyacm0
      data:
        message: I received "{{ states('sensor.serial_receiver_ttyacm0') }}"
  mode: single
